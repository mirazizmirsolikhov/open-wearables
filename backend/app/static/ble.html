<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YCBT</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0d0f0e; color: #c8d4c0;
  font-family: 'Courier New', monospace; font-size: 13px;
  height: 100vh; display: flex; flex-direction: column;
}
.top {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; height: 44px;
  border-bottom: 1px solid #1f2420; background: #131614; flex-shrink: 0;
}
.led { width: 8px; height: 8px; border-radius: 50%; background: #3a4038; flex-shrink: 0; }
.led.on   { background: #39ff6e; box-shadow: 0 0 8px #39ff6e; }
.led.err  { background: #ff4444; }
.led.busy { background: #ffb23f; animation: blink .5s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.devname { flex: 1; color: #5a6858; }
.sync-status {
  font-size: 10px; letter-spacing: 1px; color: #3a4038;
  display: flex; align-items: center; gap: 6px;
}
.sync-status.active { color: #39ff6e; }
.sync-status.error { color: #ff4444; }
.sync-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.btn {
  font-family: 'Courier New', monospace; font-size: 12px;
  background: transparent; border: 1px solid #1f2420; color: #5a6858;
  padding: 5px 12px; cursor: pointer; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: #39ff6e; color: #39ff6e; }
.btn.red:hover:not(:disabled) { border-color: #ff4444; color: #ff4444; }
.btn:disabled { opacity: .3; cursor: default; }
.body { flex: 1; display: grid; grid-template-columns: 210px 1fr; overflow: hidden; }
.metrics { border-right: 1px solid #1f2420; overflow-y: auto; }
.metric { padding: 13px 16px; border-bottom: 1px solid #1f2420; }
.m-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #5a6858; margin-bottom: 3px; }
.m-val   { font-size: 38px; line-height: 1; font-weight: bold; color: #3a4038; transition: color .3s; }
.m-val.sm { font-size: 26px; }
.m-val.live { color: #39ff6e; }
.m-val.warn { color: #ffb23f; }
.m-unit  { font-size: 10px; color: #5a6858; margin-top: 2px; }
.logwrap { display: flex; flex-direction: column; overflow: hidden; }
.log { flex: 1; overflow-y: auto; padding: 6px 12px; font-size: 11px; line-height: 1.8; }
.log::-webkit-scrollbar { width: 3px; }
.log::-webkit-scrollbar-thumb { background: #1f2420; }
.row { display: grid; grid-template-columns: 64px 1fr; gap: 8px; }
.t { color: #5a6858; }
.m { color: #c8d4c0; word-break: break-all; }
.row.ok  .m { color: #39ff6e; }
.row.err .m { color: #ff4444; }
.row.rx  .m { color: #7ab8ff; }
.row.sync .m { color: #b48eff; }

/* Overlays */
.overlay {
  position: fixed; inset: 0; background: #0d0f0e;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
  z-index: 10;
}
.overlay.gone { display: none; }
.ov-title { font-size: 32px; letter-spacing: 6px; color: #39ff6e; }
.ov-subtitle { font-size: 11px; color: #5a6858; letter-spacing: 2px; margin-top: -8px; }
.ov-btn {
  font-family: 'Courier New', monospace; font-size: 12px; letter-spacing: 2px;
  border: 1px solid #39ff6e; color: #39ff6e; background: transparent;
  padding: 11px 32px; cursor: pointer; min-width: 200px; text-align: center;
}
.ov-btn:hover:not(:disabled) { background: rgba(57,255,110,.08); }
.ov-btn:disabled { opacity: .3; cursor: default; }
.ov-btn.secondary { border-color: #1f2420; color: #5a6858; }
.ov-btn.secondary:hover:not(:disabled) { border-color: #5a6858; color: #c8d4c0; }
.ov-note { font-size: 10px; color: #5a6858; text-align: center; line-height: 2; }
.ov-form { display: flex; flex-direction: column; gap: 12px; width: 320px; }
.ov-field { display: flex; flex-direction: column; gap: 4px; }
.ov-field label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #5a6858; }
.ov-field input {
  font-family: 'Courier New', monospace; font-size: 13px;
  background: #131614; border: 1px solid #1f2420; color: #c8d4c0;
  padding: 10px 12px; outline: none;
}
.ov-field input:focus { border-color: #39ff6e; }
.ov-field input::placeholder { color: #3a4038; }
.ov-error { font-size: 11px; color: #ff4444; text-align: center; min-height: 16px; }
.ov-connected {
  font-size: 11px; color: #39ff6e; text-align: center;
  border: 1px solid #1f2420; padding: 8px 16px;
}
.ov-btn-row { display: flex; gap: 12px; justify-content: center; }
</style>
</head>
<body>

<!-- Step 1: Invitation code -->
<div class="overlay" id="ov-setup">
  <div class="ov-title">YCBT</div>
  <div class="ov-subtitle">AUTHORIZATION</div>
  <div class="ov-form">
    <div class="ov-field">
      <label>Invitation Code</label>
      <input type="text" id="inp-code" placeholder="ABCD1234" maxlength="8"
             style="text-transform: uppercase; letter-spacing: 4px; text-align: center; font-size: 18px;">
    </div>
    <div class="ov-error" id="setup-err"></div>
    <button class="ov-btn" id="btn-redeem" onclick="doRedeem()">Connect</button>
  </div>
  <div class="ov-note">Enter the invitation code from your administrator</div>
</div>

<!-- Step 2: BLE connect -->
<div class="overlay gone" id="ov-ble">
  <div class="ov-title">YCBT</div>
  <div class="ov-subtitle">DEVICE PAIRING</div>
  <div class="ov-connected" id="server-info"></div>
  <div class="ov-error" id="ble-err"></div>
  <button class="ov-btn" onclick="doConnect()">Connect Watch</button>
  <div class="ov-btn-row">
    <button class="ov-btn secondary" onclick="doResetServer()">Logout</button>
  </div>
  <div class="ov-note">Chrome / Edge · localhost or HTTPS<br>Web Bluetooth required</div>
</div>

<!-- Main UI -->
<div class="top">
  <div class="led" id="led"></div>
  <div class="devname" id="devname">—</div>
  <div class="sync-status" id="sync-status">
    <div class="sync-dot"></div>
    <span id="sync-label">OFFLINE</span>
  </div>
  <button class="btn red" id="bdis" onclick="doDisconnect()" style="display:none">Disconnect</button>
</div>

<div class="body">
  <div class="metrics">
    <div class="metric">
      <div class="m-label">Heart Rate</div>
      <div class="m-val" id="vHR">—</div>
      <div class="m-unit">BPM</div>
    </div>
    <div class="metric">
      <div class="m-label">Blood Pressure</div>
      <div class="m-val sm" id="vBP">—</div>
      <div class="m-unit">mmHg  sys/dia</div>
    </div>
    <div class="metric">
      <div class="m-label">SpO2</div>
      <div class="m-val" id="vSPO2">—</div>
      <div class="m-unit">%</div>
    </div>
    <div class="metric">
      <div class="m-label">Temperature</div>
      <div class="m-val sm" id="vTEMP">—</div>
      <div class="m-unit">°C</div>
    </div>
  </div>
  <div class="logwrap">
    <div class="log" id="log"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// BLE UUIDs & Protocol Constants (unchanged from YCBT protocol)
// ════════════════════════════════════════════════════════════════════
const UUID = {
  YC_SVC:  'be940000-7333-be46-b7ae-689e71722bd5',
  YC_W:    'be940001-7333-be46-b7ae-689e71722bd5',
  YC_N:    'be940003-7333-be46-b7ae-689e71722bd5',
  HR_SVC:  '0000180d-0000-1000-8000-00805f9b34fb',
  HR_MEAS: '00002a37-0000-1000-8000-00805f9b34fb',
  BAT_SVC: '0000180f-0000-1000-8000-00805f9b34fb',
  BAT:     '00002a19-0000-1000-8000-00805f9b34fb',
};

const DT = {
  TIME:    0x0100,
  HR:      0x0301,
  BLOOD:   0x0302,
  SPO2:    0x0303,
  STREAM:  0x0309,
  BP_MEAS: 0x032E,
  GET_ALL: 0x0220,
  GET_SPO2:0x0211,
  H_BLOOD: 0x0508,
  H_HEART: 0x0506,
  H_ALL:   0x0509,
  H_SPO2:  0x051A,
  H_COMP:  0x052F,
};

const CMDS_ON = [
  [DT.HR,      [1]],
  [DT.BLOOD,   [1]],
  [DT.SPO2,    [1]],
  [DT.STREAM,  [1]],
  [DT.BP_MEAS, [1, 115, 80, 70, 170, 70, 30, 0]],
];

const CMDS_OFF = [
  [DT.BP_MEAS, [0, 115, 80, 70, 170, 70, 30, 0]],
  [DT.STREAM,  [0]],
  [DT.SPO2,    [0]],
  [DT.BLOOD,   [0]],
  [DT.HR,      [0]],
];

const POLL_DTS = [
  DT.GET_ALL, DT.GET_SPO2,
  DT.H_BLOOD, DT.H_HEART, DT.H_ALL, DT.H_SPO2, DT.H_COMP,
];

const REARM_INTERVAL = 60000;
const SYNC_INTERVAL = 30000; // sync to backend every 30 seconds

// ════════════════════════════════════════════════════════════════════
// Server Connection State
// ════════════════════════════════════════════════════════════════════
const serverUrl = location.origin; // same origin — no CORS needed
let accessToken = localStorage.getItem('ycbt_access_token') || '';
let refreshToken = localStorage.getItem('ycbt_refresh_token') || '';
let userId = localStorage.getItem('ycbt_user_id') || '';
let recordBuffer = [];
let syncTimer = null;

function saveTokens(access, refresh, uid) {
  accessToken = access;
  refreshToken = refresh;
  userId = uid;
  localStorage.setItem('ycbt_access_token', access);
  localStorage.setItem('ycbt_refresh_token', refresh);
  localStorage.setItem('ycbt_user_id', uid);
}

function clearTokens() {
  accessToken = ''; refreshToken = ''; userId = '';
  localStorage.removeItem('ycbt_access_token');
  localStorage.removeItem('ycbt_refresh_token');
  localStorage.removeItem('ycbt_user_id');
}

// ════════════════════════════════════════════════════════════════════
// Server Setup & Invitation Code Redemption
// ════════════════════════════════════════════════════════════════════
function initOverlays() {
  if (accessToken && userId) {
    // Already authorized — go straight to BLE screen
    document.getElementById('ov-setup').classList.add('gone');
    document.getElementById('ov-ble').classList.remove('gone');
    document.getElementById('server-info').textContent = `${userId.slice(0, 8)}...`;
    startSyncTimer();
  }
}

async function doRedeem() {
  const code = document.getElementById('inp-code').value.trim().toUpperCase();
  const errEl = document.getElementById('setup-err');
  const btn = document.getElementById('btn-redeem');

  errEl.textContent = '';

  if (!code || code.length !== 8) { errEl.textContent = 'Code must be 8 characters'; return; }

  btn.disabled = true;
  btn.textContent = 'Connecting...';

  try {
    const res = await fetch(`${serverUrl}/api/v1/invitation-code/redeem`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });

    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `HTTP ${res.status}`);
    }

    const data = await res.json();
    saveTokens(data.access_token, data.refresh_token, data.user_id);

    log(`Authorized. User: ${data.user_id}`, 'ok');

    document.getElementById('ov-setup').classList.add('gone');
    document.getElementById('ov-ble').classList.remove('gone');
    document.getElementById('server-info').textContent = `${data.user_id.slice(0, 8)}...`;
    startSyncTimer();
  } catch (e) {
    errEl.textContent = e.message;
    log(`Server error: ${e.message}`, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Connect';
  }
}

function doResetServer() {
  clearTokens();
  stopSyncTimer();
  document.getElementById('ov-ble').classList.add('gone');
  document.getElementById('ov-setup').classList.remove('gone');
  document.getElementById('inp-url').value = '';
  document.getElementById('inp-code').value = '';
  document.getElementById('setup-err').textContent = '';
  setSyncStatus('offline');
}

// ════════════════════════════════════════════════════════════════════
// Token Refresh
// ════════════════════════════════════════════════════════════════════
async function doRefreshToken() {
  if (!refreshToken || !serverUrl) return false;

  try {
    const res = await fetch(`${serverUrl}/api/v1/token/refresh`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: refreshToken }),
    });

    if (!res.ok) {
      log('Token refresh failed — re-authenticate', 'err');
      clearTokens();
      return false;
    }

    const data = await res.json();
    accessToken = data.access_token;
    refreshToken = data.refresh_token;
    localStorage.setItem('ycbt_access_token', accessToken);
    localStorage.setItem('ycbt_refresh_token', refreshToken);
    log('Token refreshed', 'ok');
    return true;
  } catch (e) {
    log(`Token refresh error: ${e.message}`, 'err');
    return false;
  }
}

// ════════════════════════════════════════════════════════════════════
// Backend Sync
// ════════════════════════════════════════════════════════════════════
function getTimezone() {
  const off = -new Date().getTimezoneOffset();
  const sign = off >= 0 ? '+' : '-';
  const h = String(Math.floor(Math.abs(off) / 60)).padStart(2, '0');
  const m = String(Math.abs(off) % 60).padStart(2, '0');
  return `${sign}${h}:${m}`;
}

function makeRecordId() {
  return 'web-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
}

function makeSource() {
  return {
    appId: 'com.ycbt.web-ble',
    deviceId: device ? (device.id || 'unknown') : 'unknown',
    deviceName: device ? (device.name || 'YCBT Watch') : 'YCBT Watch',
    deviceManufacturer: 'YCBT',
    deviceModel: 'Web BLE',
    deviceType: 'watch',
    recordingMethod: 'automatic',
  };
}

function bufferMetrics(data) {
  if (!accessToken || !userId) return;

  const now = new Date().toISOString();
  const zone = getTimezone();
  const source = makeSource();

  if (data.hr > 0) {
    recordBuffer.push({
      id: makeRecordId(),
      type: 'HEART_RATE',
      startDate: now, endDate: now,
      zoneOffset: zone, source,
      value: data.hr, unit: 'bpm',
      metadata: null,
    });
  }

  if (data.sbp > 0 && data.dbp > 0) {
    const parentId = makeRecordId();
    recordBuffer.push({
      id: parentId + '-sys',
      parentId,
      type: 'BLOOD_PRESSURE_SYSTOLIC',
      startDate: now, endDate: now,
      zoneOffset: zone, source,
      value: data.sbp, unit: 'mmHg',
      metadata: null,
    });
    recordBuffer.push({
      id: parentId + '-dia',
      parentId,
      type: 'BLOOD_PRESSURE_DIASTOLIC',
      startDate: now, endDate: now,
      zoneOffset: zone, source,
      value: data.dbp, unit: 'mmHg',
      metadata: null,
    });
  }

  if (data.spo2 > 0) {
    recordBuffer.push({
      id: makeRecordId(),
      type: 'OXYGEN_SATURATION',
      startDate: now, endDate: now,
      zoneOffset: zone, source,
      value: data.spo2, unit: '%',
      metadata: null,
    });
  }

  if (data.temp > 0) {
    recordBuffer.push({
      id: makeRecordId(),
      type: 'BODY_TEMPERATURE',
      startDate: now, endDate: now,
      zoneOffset: zone, source,
      value: data.temp, unit: 'degC',
      metadata: null,
    });
  }
}

async function flushSync() {
  if (!recordBuffer.length || !accessToken || !userId || !serverUrl) return;

  const records = recordBuffer.splice(0);
  const payload = {
    provider: 'samsung',
    sdkVersion: 'web-ble-1.0',
    syncTimestamp: new Date().toISOString(),
    data: { records, sleep: [], workouts: [] },
  };

  setSyncStatus('syncing');
  log(`SYNC ${records.length} records...`, 'sync');

  try {
    let res = await fetch(`${serverUrl}/api/v1/sdk/users/${userId}/sync`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${accessToken}`,
      },
      body: JSON.stringify(payload),
    });

    // Token expired — try refresh
    if (res.status === 401) {
      const refreshed = await doRefreshToken();
      if (refreshed) {
        res = await fetch(`${serverUrl}/api/v1/sdk/users/${userId}/sync`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${accessToken}`,
          },
          body: JSON.stringify(payload),
        });
      } else {
        recordBuffer.unshift(...records);
        setSyncStatus('error');
        return;
      }
    }

    if (res.ok) {
      setSyncStatus('active');
      log(`SYNC OK (${records.length} records)`, 'ok');
    } else {
      const body = await res.json().catch(() => ({}));
      log(`SYNC FAIL: ${body.detail || res.status}`, 'err');
      recordBuffer.unshift(...records); // put back for retry
      setSyncStatus('error');
    }
  } catch (e) {
    log(`SYNC ERROR: ${e.message}`, 'err');
    recordBuffer.unshift(...records);
    setSyncStatus('error');
  }
}

function startSyncTimer() {
  if (syncTimer) return;
  setSyncStatus('active');
  syncTimer = setInterval(flushSync, SYNC_INTERVAL);
}

function stopSyncTimer() {
  if (syncTimer) { clearInterval(syncTimer); syncTimer = null; }
  setSyncStatus('offline');
}

function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  const label = document.getElementById('sync-label');
  el.className = 'sync-status';
  if (state === 'active')   { el.classList.add('active'); label.textContent = 'SYNC'; }
  else if (state === 'syncing') { el.classList.add('active'); label.textContent = 'SYNCING...'; }
  else if (state === 'error')   { el.classList.add('error'); label.textContent = 'SYNC ERR'; }
  else { label.textContent = 'OFFLINE'; }
}

// ════════════════════════════════════════════════════════════════════
// CRC16 & Frame Protocol
// ════════════════════════════════════════════════════════════════════
function crc16(data) {
  let s = 0xFFFF;
  for (const b of data) {
    s = (((s << 8) & 0xFF00) | ((s >> 8) & 0xFF)) ^ (b & 0xFF);
    s ^= (s & 0xFF) >> 4;
    s ^= (s << 12) & 0xFFFF;
    s ^= ((s & 0xFF) << 5) & 0xFFFF;
  }
  return s & 0xFFFF;
}

function buildFrame(dt, payload) {
  payload = Array.isArray(payload) ? new Uint8Array(payload) :
            payload instanceof Uint8Array ? payload : new Uint8Array(0);
  const g = (dt >> 8) & 0xFF, k = dt & 0xFF;
  const n = payload.length + 6;
  const hdr = new Uint8Array([g, k, n & 0xFF, n >> 8, ...payload]);
  const c = crc16(hdr);
  return new Uint8Array([...hdr, c & 0xFF, c >> 8]);
}

function parseFrame(buf) {
  const b = new Uint8Array(buf instanceof ArrayBuffer ? buf : buf.buffer);
  if (b.length < 6) return null;
  const g = b[0], k = b[1];
  const n = b[2] | (b[3] << 8);
  if (n !== b.length) return null;
  return { dt: (g << 8) | k, g, k, p: b.slice(4, n - 2), hex: toHex(b) };
}

function toHex(b) {
  return Array.from(b).map(x => x.toString(16).padStart(2,'0').toUpperCase()).join(' ');
}

// ════════════════════════════════════════════════════════════════════
// Metrics Update (single entry point)
// ════════════════════════════════════════════════════════════════════
function updateMetrics(data) {
  if (data.hr   > 0)  lastKnown.hr   = data.hr;
  if (data.sbp  > 0)  lastKnown.sbp  = data.sbp;
  if (data.dbp  > 0)  lastKnown.dbp  = data.dbp;
  if (data.spo2 > 0)  lastKnown.spo2 = data.spo2;
  if (data.temp > 0)  lastKnown.temp = data.temp;

  const effective = {
    hr:     lastKnown.hr,
    sbp:    lastKnown.sbp,
    dbp:    lastKnown.dbp,
    spo2:   lastKnown.spo2,
    temp:   lastKnown.temp,
    source: data.source,
    ts:     Date.now(),
  };

  if (effective.hr   !== undefined) setVal('vHR',   effective.hr,  effective.hr < 50 || effective.hr > 130);
  if (effective.sbp  !== undefined && effective.dbp !== undefined)
    setVal('vBP', `${effective.sbp}/${effective.dbp}`, effective.sbp > 140 || effective.sbp < 90, true);
  if (effective.spo2 !== undefined) setVal('vSPO2', effective.spo2, effective.spo2 < 95);
  if (effective.temp !== undefined) setVal('vTEMP', effective.temp, false, true);

  // Buffer for backend sync
  bufferMetrics(data);
}

// ════════════════════════════════════════════════════════════════════
// Dispatch — frame → metrics
// ════════════════════════════════════════════════════════════════════
function dispatch(f) {
  const p = f.p;
  if (p.length === 1 && p[0] === 0xFC) return;

  switch (f.dt) {
    case 0x0601:
      if (p[0] > 0) updateMetrics({ hr: p[0], source: 'yc' });
      break;
    case 0x0603:
      if (p.length >= 2) updateMetrics({ sbp: p[0], dbp: p[1], hr: p[2] || undefined, source: 'yc' });
      break;
    case 0x0602:
      if (p[0] > 0) updateMetrics({ spo2: p[0], source: 'yc' });
      break;
    case 0x060A:
      if (p.length >= 11) updateMetrics({ hr: p[7], sbp: p[8], dbp: p[9], spo2: p[10], source: 'comprehensive' });
      break;
    case 0x0410:
      if (p.length >= 3 && p[0] === 0) updateMetrics({ sbp: p[1], dbp: p[2], source: 'bp_result' });
      break;
    case 0x040E:
      log(`Done type=${p[0]} ${p[1] === 1 ? 'OK' : 'FAIL'}`);
      break;
    case 0x0517: {
      for (let i = 0; i + 7 < p.length; i += 8) {
        const sbp = p[i+5], dbp = p[i+6], hr = p[i+7];
        if (sbp > 0 && dbp > 0) updateMetrics({ sbp, dbp, hr: hr||undefined, source: 'history_bp' });
      }
      break;
    }
    case 0x0515: {
      for (let i = 0; i + 5 < p.length; i += 6) {
        const hr = p[i+5];
        if (hr > 0) updateMetrics({ hr, source: 'history_hr' });
      }
      break;
    }
    case 0x0518: {
      for (let i = 0; i + 19 < p.length; i += 20) {
        updateMetrics({
          hr:   p[i+6]||undefined,
          sbp:  p[i+7]||undefined,
          dbp:  p[i+8]||undefined,
          spo2: p[i+9]||undefined,
          temp: (p.length > i+11 && p[i+11]) ? p[i+11] : undefined,
          source: 'history_all'
        });
      }
      break;
    }
    case 0x052F: {
      if (p.length >= 10)
        updateMetrics({ hr: p[6]||undefined, sbp: p[7]||undefined, dbp: p[8]||undefined, spo2: p[9]||undefined, source: 'history_comp' });
      break;
    }
    default:
      log(`RX [${f.dt.toString(16).toUpperCase()}] ${f.hex}`, 'rx');
  }
}

// ════════════════════════════════════════════════════════════════════
// BLE
// ════════════════════════════════════════════════════════════════════
let device, server, writeChar;
let pollTimer = null, rearmTimer = null;
const lastKnown = { hr: undefined, sbp: undefined, dbp: undefined, spo2: undefined, temp: undefined };

function bleErr(msg) {
  document.getElementById('ble-err').textContent = msg;
}

async function doConnect() {
  bleErr('');
  if (!navigator.bluetooth) {
    const reason = location.protocol === 'http:' && location.hostname !== 'localhost'
      ? `Web Bluetooth requires HTTPS. Open: https://${location.host}/ble`
      : 'Web Bluetooth not supported in this browser. Use Chrome or Edge.';
    bleErr(reason);
    log(reason, 'err');
    return;
  }
  led('busy');
  try {
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [UUID.HR_SVC] }],
      optionalServices: [UUID.YC_SVC, UUID.YC_W, UUID.YC_N, UUID.BAT_SVC],
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    document.getElementById('ov-ble').classList.add('gone');
    log(`Selected: ${device.name || device.id}`);

    server = await device.gatt.connect();
    log('GATT connected', 'ok');

    // YC custom service
    let ycOk = false;
    try {
      const ycSvc = await server.getPrimaryService(UUID.YC_SVC);
      writeChar = await ycSvc.getCharacteristic(UUID.YC_W);
      await writeChar.startNotifications();
      writeChar.addEventListener('characteristicvaluechanged', onYCData);
      log('be940001 OK', 'ok');
      ycOk = true;
      try {
        const n2 = await ycSvc.getCharacteristic(UUID.YC_N);
        await n2.startNotifications();
        n2.addEventListener('characteristicvaluechanged', onYCData);
        log('be940003 OK', 'ok');
      } catch {}
    } catch(e) { log(`YC: ${e.message}`); }

    // Standard GATT HR
    try {
      const hrSvc  = await server.getPrimaryService(UUID.HR_SVC);
      const hrChar = await hrSvc.getCharacteristic(UUID.HR_MEAS);
      await hrChar.startNotifications();
      hrChar.addEventListener('characteristicvaluechanged', onGattHR);
      log('GATT HR 0x2a37 OK', 'ok');
    } catch(e) { log(`GATT HR: ${e.message}`, 'err'); }

    if (ycOk) {
      const t = Math.floor(Date.now() / 1000) - 946684800;
      const tb = new Uint8Array(4);
      new DataView(tb.buffer).setUint32(0, t, true);
      await send(DT.TIME, tb);
      log('Time synced', 'ok');

      for (const [dt, pl] of CMDS_ON) {
        await send(dt, pl);
        await sleep(50);
      }
      log('Measurements started', 'ok');

      startPoll();
      rearmTimer = setInterval(rearm, REARM_INTERVAL);
    }

    document.getElementById('devname').textContent = device.name || device.id;
    document.getElementById('bdis').style.display = '';
    led('on');
    log('Ready', 'ok');

  } catch(e) {
    if (e.name !== 'NotFoundError') {
      bleErr(e.message);
      log(e.message, 'err');
    }
    console.error(e);
    led('err');
  }
}

function startPoll() {
  if (pollTimer) return;
  let i = 0;
  pollTimer = setInterval(async () => {
    if (!writeChar) return;
    await send(POLL_DTS[i % POLL_DTS.length], []);
    i++;
  }, 500);
}

async function rearm() {
  if (!writeChar) return;
  log('>> re-arming');
  for (const [dt, pl] of CMDS_ON) {
    await send(dt, pl);
    await sleep(50);
  }
}

function onDisconnect() {
  clearInterval(pollTimer); pollTimer = null;
  clearInterval(rearmTimer); rearmTimer = null;
  led('err'); log('Disconnected', 'err');
  document.getElementById('devname').textContent = '—';
  document.getElementById('bdis').style.display = 'none';
  // Flush remaining records before showing BLE overlay
  flushSync();
  document.getElementById('ov-ble').classList.remove('gone');
  writeChar = null;
}

function doDisconnect() {
  for (const [dt, pl] of CMDS_OFF) send(dt, pl);
  setTimeout(() => device?.gatt?.disconnect(), 300);
}

function onYCData(e) {
  const f = parseFrame(e.target.value.buffer);
  if (!f) { log(`malformed: ${toHex(new Uint8Array(e.target.value.buffer))}`, 'err'); return; }
  dispatch(f);
}

function onGattHR(e) {
  const dv = e.target.value;
  const flags = dv.getUint8(0);
  const hr = (flags & 1) ? dv.getUint16(1, true) : dv.getUint8(1);
  updateMetrics({ hr, source: 'gatt' });
  log(`GATT HR: ${hr} BPM  ${toHex(new Uint8Array(dv.buffer))}`, 'rx');
}

async function send(dt, payload) {
  if (!writeChar) return;
  const frame = buildFrame(dt, payload);
  log(`TX [${dt.toString(16).toUpperCase()}] ${toHex(frame)}`);
  try {
    await writeChar.writeValueWithoutResponse(frame.buffer);
  } catch {
    try { await writeChar.writeValueWithResponse(frame.buffer); }
    catch(e) { log(`write err: ${e.message}`, 'err'); }
  }
}

// ════════════════════════════════════════════════════════════════════
// UI Helpers
// ════════════════════════════════════════════════════════════════════
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function setVal(id, val, warn, sm) {
  const el = document.getElementById(id);
  el.textContent = val;
  el.className = 'm-val' + (sm ? ' sm' : '') + ' ' + (warn ? 'warn' : 'live');
}

function log(msg, type) {
  const el = document.getElementById('log');
  const t = new Date().toISOString().slice(11,19);
  const r = document.createElement('div');
  r.className = 'row ' + (type || '');
  r.innerHTML = `<span class="t">${t}</span><span class="m">${msg}</span>`;
  el.appendChild(r);
  while (el.children.length > 300) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function led(s) { document.getElementById('led').className = 'led ' + s; }

// ════════════════════════════════════════════════════════════════════
// Init
// ════════════════════════════════════════════════════════════════════
log('Ready');
initOverlays();

// Allow Enter key in setup form
document.getElementById('inp-code').addEventListener('keydown', e => {
  if (e.key === 'Enter') doRedeem();
});
</script>
